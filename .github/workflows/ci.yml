# Runs on every pull request and on pushes to main: lint, formatting, tests, build.
# The steps are skipped while there is no package.json, so this workflow can be merged
# before the frontend exists without turning every pull request red.
#
# It expects these scripts in package.json:
#   lint, format:check, test, build
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Look for a frontend
        id: frontend
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping the checks."
          fi

      - name: Set up Node
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # TODO: add `cache: npm` once package-lock.json is committed

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.exists == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.frontend.outputs.exists == 'true'
        run: npm run format:check

      - name: Test
        if: steps.frontend.outputs.exists == 'true'
        run: npm run test

      - name: Build
        if: steps.frontend.outputs.exists == 'true'
        run: npm run build
