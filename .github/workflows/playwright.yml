# Runs the Playwright end-to-end tests on every pull request and on pushes to main.
# Keycloak and RAGdoll are replaced by e2e/support/mock-backend.mjs, which Playwright starts
# together with a production build of the app, so no secrets or .env are needed.
# See docs/e2e-testing.md.
name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going for the old commit.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job per browser, running side by side, so each job only installs and runs one browser.
    name: End-to-end tests (${{ matrix.project }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # Let the other browsers finish, so a failure in one still shows how the others did.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      # All three browsers here, one per job; locally, npm run test:e2e runs only Chromium.
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
