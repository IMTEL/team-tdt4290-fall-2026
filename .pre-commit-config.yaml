# Optional local hooks, same approach as RAGdoll so both repos behave alike.
# Install once:  pip install pre-commit && pre-commit install --hook-type commit-msg
#
# What it does:
#   - rejects commit messages that are not Conventional Commits (see CONTRIBUTING.md)
#     (formatting is not hooked here: run `npm run format`, and CI checks it on every pull request)
#   - catches broken YAML and stray large files before they reach a pull request
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trim-trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore]
